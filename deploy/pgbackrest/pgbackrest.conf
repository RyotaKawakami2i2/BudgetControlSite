# pgBackRest の設定（本番の DB のサーバー側。詳細設計書 12.4）。<...> は環境ごとの値に置き換える。
# バックアップはバックアップサーバー（repo1）から実行する。本番のサーバーにはバックアップを消す権限を持たせない。
# 保管場所の暗号化の鍵（repo1-cipher-pass）はバックアップサーバーだけに置き、ここには書かない。
[global]
repo1-host=<バックアップサーバー>
repo1-host-user=pgbackrest
repo1-host-type=tls
repo1-host-ca-file=/etc/postgresql/tls/ca.crt
repo1-host-cert-file=/etc/postgresql/tls/pgbackrest-client.crt
repo1-host-key-file=/etc/postgresql/tls/pgbackrest-client.key
log-level-console=info
log-level-file=off
compress-type=zst

[tyj]
pg1-path=/var/lib/postgresql/18/docker
