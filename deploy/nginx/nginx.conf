# nginx の設定（詳細設計書 12.2）。<...> は環境ごとの値に置き換える。
# 暗号方式は Mozilla の推奨設定（intermediate）に合わせる。セキュリティのヘッダーはアプリが付ける。
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # アクセスログには、クエリ文字列を含まない $uri を出す（招待・再設定のトークンなどを残さない）
    log_format tyj '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout tyj;
    error_log /dev/stderr warn;

    # 認証の画面は送信元 IP ごとに大まかに制限する（細かい制限はアプリで行う。詳細設計書 6.9）
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    server {
        listen 80;
        server_name <サーバー名（例: tasks.corp.example）>;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name <サーバー名（例: tasks.corp.example）>;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        client_max_body_size 64k;

        # nginx が自分で返すエラーの画面にも、HSTS と X-Content-Type-Options を付ける
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        # X-Forwarded-For は、利用者から送られた値を引き継がず、nginx が見た送信元で上書きする（なりすましを防ぐ）
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        # アプリが付けたヘッダーと重ならないよう、アプリの応答からは消す
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;

        location /health/ {
            allow <監視サーバーの IP>;
            deny all;
            proxy_pass http://app:8080;
        }

        location /account/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://app:8080;
        }

        location / {
            proxy_pass http://app:8080;
        }
    }
}
