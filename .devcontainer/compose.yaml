# 開発環境のコンテナ構成（開発専用。本番の構成は deploy/compose.yaml に置く）
# パスワードは開発用の固定値で、秘密情報ではない。DB はホストに公開しない。

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/BudgetControlSite:cached
      # Claude Code の設定（ログイン情報を含む）を、コンテナを作り直しても残す
      - claude-config:/home/vscode/.claude
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # アプリの接続先。本番では Docker の secrets で渡す（詳細設計書 11章）
      ConnectionStrings__App: "Host=db;Port=5432;Database=taskyojitsu;Username=tyj_app;Password=dev-app-password"
      # マイグレーション用（DB の所有者のアカウント）
      ConnectionStrings__Owner: "Host=db;Port=5432;Database=taskyojitsu;Username=tyj_owner;Password=dev-owner-password"
      # 結合テスト用。開発コンテナでは、Testcontainers の代わりにこの DB を使う
      ConnectionStrings__Test: "Host=db;Port=5432;Database=taskyojitsu_test;Username=tyj_owner;Password=dev-owner-password"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseStartTls: "false"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    # PostgreSQL 18 の公式イメージは、データを /var/lib/postgresql の下に置く
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev-postgres-password
    volumes:
      - pgdata:/var/lib/postgresql
      # 最初の起動のときだけ、アカウントと DB を作る（db/init/01-roles.sql）
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 初期化中の一時的なサーバーは TCP で待ち受けないため、TCP で確かめる
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # 開発用のメール受信サーバー。送ったメールは画面（8025 番）で確かめる
    # 版は、公開から 7 日以上たったものに固定する（基本設計書 8.6）
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped

volumes:
  pgdata:
  claude-config:
